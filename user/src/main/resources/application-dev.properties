#===========================#
#      Database Config      #
#===========================#
spring.datasource.url=jdbc:postgresql://localhost:5432/wallet_user
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

#===========================#
#     Eureka Config         #
#===========================#
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

user.mock.enable=false
service.config.source=database

#===========================#
#     Cache Config          #
#===========================#
application.cache.enabled=true
service.config.cache.enabled=true
service.config.cache.name=service-config-cache